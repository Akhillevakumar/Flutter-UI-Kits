name: flutter_ui_kits_workspace

packages:
  - apps/**

command:
  bootstrap:
    usePubspecOverrides: true

scripts:
  analyze:
    description: Run flutter analyze in all Flutter packages.
    run: melos exec --fail-fast -- flutter analyze

  test:
    description: Run flutter test in all Flutter packages.
    run: melos exec --fail-fast -- flutter test
